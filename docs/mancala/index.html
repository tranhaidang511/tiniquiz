    <noscript>

            style="display:none;visibility:hidden"></iframe>
    </noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div id="app">
        <div class="header-controls">
            <button id="home-btn" class="icon-btn" aria-label="Back to Home">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                    <polyline points="9 22 9 12 15 12 15 22"></polyline>

            </button>
            <h1 id="game-title">Mancala</h1>
        </div>

        <!-- Language Switcher -->
        <div class="lang-switcher">
            <button class="lang-btn active" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="ja">JA</button>
            <button class="lang-btn" data-lang="vi">VI</button>
        </div>

        <!-- Menu View -->
        <div id="menu-view" class="card animate-fade-in">
            <h2 id="menu-title">Game Setup</h2>
            <div class="setup-group">
                <h3 id="label-mode">Game Mode</h3>
                <div class="radio-group">
                    <button id="mode-two-player" class="setup-btn mode-btn active" data-mode="TWO_PLAYER">2
                        Players</button>
                    <button id="mode-vs-ai" class="setup-btn mode-btn" data-mode="VS_AI">vs AI</button>
                </div>
            </div>

            <div class="setup-group difficulty-section hidden">
                <h3 id="label-difficulty">Difficulty</h3>
                <div class="radio-group">
                    <button class="setup-btn mode-btn" data-difficulty="EASY" id="difficulty-easy">Easy</button>
                    <button class="setup-btn mode-btn active" data-difficulty="MEDIUM"
                        id="difficulty-medium">Medium</button>

                </div>
            </div>

            <div class="setup-group">
                <h3 id="label-pit-count">Pits Per Side</h3>
                <div class="radio-group">
                    <button class="setup-btn pit-btn" data-pits="4">4</button>
                    <button class="setup-btn pit-btn" data-pits="5">5</button>
                    <button class="setup-btn pit-btn active" data-pits="6">6</button>
                    <button class="setup-btn pit-btn" data-pits="7">7</button>
                    <button class="setup-btn pit-btn" data-pits="8">8</button>
                </div>
            </div>

            <div class="setup-group">
                <h3 id="label-initial-stones">Stones Per Pit</h3>
                <div class="radio-group">
                    <button class="setup-btn stones-btn" data-stones="3">3</button>
                    <button class="setup-btn stones-btn active" data-stones="4">4</button>
                    <button class="setup-btn stones-btn" data-stones="5">5</button>
                </div>
            </div>

            <button id="start-btn" class="primary">Start Game</button>
        </div>

                </div>
                <div class="game-timer">

                </div>
            </div>

            <div id="board-container">
                <!-- Board will be rendered here -->
            </div>
        </div>

        <!-- Result View -->
        <div id="result-view" class="card hidden animate-fade-in">
            <h2 id="result-title">Game Over!</h2>

            <div class="winner-display" id="winner-display">
