m="1"]{color:#8ab4f8}.cell[data-num="2"]{color:#81c995}.cell[data-num="3"]{color:#f28b82}.cell[data-num="4"]{color:#ce93d8}.cell[data-num="5"]{color:#ff8a65}.cell[data-num="6"]{color:#4dd0e1}.cell[data-num="7"]{color:#aed581}.cell[data-num="8"]{color:#ffb74d}.minesweeper-board[style*="grid-template-columns: repeat(5"] .cell,.minesweeper-board[style*="grid-template-columns: repeat(10"] .cell{width:50px;height:50px;font-size:1rem}.minesweeper-board[style*="grid-template-columns: repeat(15"] .cell{width:35px;height:35px;font-size:.9rem}.minesweeper-board[style*="grid-template-columns: repeat(20"] .cell{width:30px;height:30px;font-size:.85rem}.minesweeper-board[style*="grid-template-columns: repeat(25"] .cell{width:24px;height:24px;font-size:.75rem}.result-message{font-size:1.25rem;margin-bottom:2rem;color:var(--text-secondary)}.result-stats{display:flex;justify-content:center;gap:2rem;margin:2rem 0;padding:1.5rem;background:var(--bg-secondary);border-radius:.5rem}@keyframes fadeIn{0%{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.animate-fade-in{animation:fadeIn .3s ease}@media(max-width:768px){h1{font-size:2rem}.card{padding:1.5rem}.game-header{flex-direction:column;gap:.75rem}.result-stats{flex-direction:column;gap:1rem}.difficulty-selector{gap:.5rem}.diff-btn{font-size:.9rem;padding:.875rem .5rem}.cell{width:30px;height:30px;font-size:.8rem}}@media(max-width:480px){.cell{width:20px;height:20px;font-size:.7rem}.minesweeper-board[style*="grid-template-columns: repeat(10"] .cell{width:25px;height:25px}.minesweeper-board[style*="grid-template-columns: repeat(15"] .cell{width:15px;height:15px}.minesweeper-board[style*="grid-template-columns: repeat(20"] .cell{width:12px;height:12px}.minesweeper-board[style*="grid-template-columns: repeat(25"] .cell{width:10px;height:10px}}@media(min-width:1200px){.minesweeper-board[style*="grid-template-columns: repeat(5"] .cell,.minesweeper-board[style*="grid-template-columns: repeat(10"] .cell{width:55px;he <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript>
        <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-56G5F5W4" height="0" width="0"
            style="display:none;visibility:hidden"></iframe>
    </noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div id="app">
        <div class="header-controls">
            <button id="home-btn" class="icon-btn" aria-label="Back to Home">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
            </button>
            <h1 id="game-title">Minesweeper</h1>
        </div>

        <!-- Language Switcher -->
        <div class="lang-switcher">
            <button class="lang-btn active" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="ja">JA</button>
            <button class="lang-btn" data-lang="vi">VI</button>
        </div>

        <!-- Menu View -->
        <div id="menu-view" class="card animate-fade-in">
            <h2 id="menu-title">Game Setup</h2>
            <div class="setup-group">
                <h3 id="label-difficulty">Board Size</h3>
                <div class="radio-group">
                    <button class="setup-btn diff-btn active" data-diff="BEGINNER">Beginner</button>
                    <button class="setup-btn diff-btn" data-diff="EASY">Easy</button>
                    <button class="setup-btn diff-btn" data-diff="MEDIUM">Medium</button>
                    <button class="setup-btn diff-btn" data-diff="HARD">Hard</button>
                    <button class="setup-btn diff-btn" data-diff="EXPERT">Expert</button>
                </div>
            </div>

            <button id="start-btn" class="primary">Start Game</button>
        </div>

        <!-- Game View -->
        <div id="game-view" class="card hidden animate-fade-in">
            <button id="new-game-btn" class="primary">New Game</button>

            <div class="game-header">
                <div class="stat">
                    <div class="stat-label" id="label-time">Time</div>
                    <div class="stat-value" id="time-display">0:00</div>
                </div>
                <div class="stat">
                    <div class="stat-label" id="label-mines">Mines</div>
                    <div class="stat-value" id="mines-display">0</div>
                </div>
            </div>

            <div id="board-container">
                <div id="minesweeper-board" class="minesweeper-board">
                    <!-- Board cells will be rendered here -->
                </div>
            </div>
        </div>

        <!-- Result View -->
        <div id="result-view" class="card hidden animate-fade-in">
            <h2 id="result-title">Game Over!</h2>

            <div class="result-message" id="result-message"></div>

            <div class="result-stats">
                <div class="stat">
                    <div class="stat-label" id="label-total-time">Total Time</div>
                    <div class="stat-value" id="final-time">0:00</div>
                </div>
            </div>

            <!-- High Scores Table -->
            <div class="high-scores-container">
                <h3 id="high-scores-title">High Scores</h3>
                <table id="high-scores-table">
                    <thead>
                        <tr>
                            <th id="th-rank">Rank</th>
                            <th id="th-time">Time</th>
                            <th id="th-date">Date</th>
                        </tr>
                    </thead>
                    <tbody id="high-scores-body">
                        <!-- Scores injected here -->
                    </tbody>
                </table>
            </div>

            <button id="play-again-btn" class="primary">Play Again</button>
        </div>
    </div>

</body>

</html>
