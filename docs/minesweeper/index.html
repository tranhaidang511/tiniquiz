    <!-- Google Tag Manager (noscript) -->
    <noscript>
        <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-56G5F5W4" height="0" width="0"
            style="display:none;visibility:hidden"></iframe>
    </noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div id="app">
        <div class="header-controls">
            <button id="home-btn" class="icon-btn" aria-label="Back to Home">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
            </button>
            <h1 id="game-title">Minesweeper</h1>
        </div>

        <!-- Language Switcher -->
        <div class="lang-switcher">
            <button class="lang-btn active" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="ja">JA</button>
            <button class="lang-btn" data-lang="vi">VI</button>
        </div>

        <!-- Menu View -->
        <div id="menu-view" class="card animate-fade-in">
            <h2 id="menu-title">Game Setup</h2>
            <div class="setup-group">
                <h3 id="label-difficulty">Board Size</h3>
                <div class="radio-group">
                    <button class="setup-btn diff-btn active" data-diff="EASY">Easy</button>
                    <button class="setup-btn diff-btn" data-diff="MEDIUM">Medium</button>
                    <button class="setup-btn diff-btn" data-diff="HARD">Hard</button>
                    <button class="setup-btn diff-btn" data-diff="CUSTOM">Custom</button>
                </div>

                <div id="custom-setup" class="custom-setup">
                    <div class="setup-field">
                        <label for="custom-rows">Rows</label>
                        <input type="number" id="custom-rows" min="5" max="30" value="10">
                    </div>
                    <div class="setup-field">
                        <label for="custom-cols">Cols</label>
                        <input type="number" id="custom-cols" min="5" max="30" value="10">
                    </div>
                    <div class="setup-field">
                        <label for="custom-mines">Mines</label>
                        <input type="number" id="custom-mines" min="1" max="899" value="10">
                    </div>
                </div>
            </div>

            <button id="start-btn" class="primary">Start Game</button>
        </div>

        <!-- Game View -->
        <div id="game-view" class="card hidden animate-fade-in">
            <button id="new-game-btn" class="primary">New Game</button>

            <div class="game-header">
                <div class="stat">
                    <div class="stat-label" id="label-time">Time</div>
                    <div class="stat-value" id="time-display">0:00</div>
                </div>
                <div class="stat">
                    <div class="stat-label" id="label-mines">Mines</div>
                    <div class="stat-value" id="mines-display">0</div>
                </div>
            </div>

            <div id="board-container">
                <div id="minesweeper-board" class="minesweeper-board">
                    <!-- Board cells will be rendered here -->
                </div>
            </div>
        </div>

        <!-- Result View -->
        <div id="result-view" class="card hidden animate-fade-in">
            <h2 id="result-title">Game Over!</h2>

            <div class="result-message" id="result-message"></div>

            <div class="result-stats">
                <div class="stat">
                    <div class="stat-label" id="label-total-time">Total Time</div>
                    <div class="stat-value" id="final-time">0:00</div>
                </div>
            </div>

            <!-- High Scores Table -->
            <div class="high-scores-container">
                <h3 id="high-scores-title">High Scores</h3>
                <table id="high-scores-table">
                    <thead>
                        <tr>
                            <th id="th-rank">Rank</th>
                            <th id="th-time">Time</th>
                            <th id="th-date">Date</th>
                        </tr>
                    </thead>
                    <tbody id="high-scores-body">
                        <!-- Scores injected here -->
                    </tbody>
                </table>
            </div>

            <button id="play-again-btn" class="primary">Play Again</button>
        </div>
    </div>

</body>
