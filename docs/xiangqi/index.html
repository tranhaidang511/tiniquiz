nt-size:1.3rem;font-weight:600;color:var(--text-primary)}.stat{text-align:center}.stat-label{font-size:.9rem;color:var(--text-secondary);margin-bottom:5px}.stat-value{font-size:1.5rem;font-weight:700;color:var(--accent-primary)}#board-container{width:100%;max-width:600px;margin:0 auto;background-color:var(--board-bg);border:5px solid var(--board-line-color);border-radius:4px;box-shadow:var(--shadow-lg);aspect-ratio:9/10}#board{width:100%;height:100%;cursor:pointer}.grid-line{fill:none;stroke:var(--board-line-color);stroke-width:2}.piece{transition:transform .2s cubic-bezier(.4,0,.2,1);font-family:"Noto Serif SC",serif;font-weight:700}.piece circle.base{fill:var(--piece-bg);stroke:var(--board-line-color);stroke-width:2}.piece text{-webkit-user-select:none;user-select:none;pointer-events:none;font-size:24px}.piece.red text{fill:var(--piece-red)}.piece.red circle.base{stroke:var(--piece-red)}.piece.black text{fill:var(--piece-black)}.piece.black circle.base{stroke:var(--piece-black)}.selected-marker{fill:none;stroke:#2e7d32;stroke-width:3;stroke-dasharray:5,3}.capture-marker{stroke-dasharray:2,2}.move-marker{fill:#2e7d3299}.last-move-from,.last-move-to{fill:#8bc34a99}@keyframes rotate{0%{transform:rotate(0)}to{transform:rotate(360deg)}}.winner-display{text-align:center;margin:30px 0;padding:30px;background:#4a90e21a;border-radius:12px;border:1px solid var(--border-color)}.winner-display h3{font-size:1.5rem;margin-bottom:10px;background:linear-gradient(135deg,var(--accent-primary),var(--accent-secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.winner-display p{font-size:1.2rem;color:var(--text-secondary)}.result-stats{display:flex;justify-content:center;gap:60px;margin:30px 0}</style>
  </head>

  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript>
      <iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-56G5F5W4"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe>
    </noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div id="app">
      <div class="header-controls">
        <button id="home-btn" class="icon-btn" aria-label="Back to Home">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="48"
            height="48"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </button>
        <h1 id="game-title">Xiangqi</h1>
      </div>

      <!-- Language Switcher -->
      <div class="lang-switcher">
        <button class="lang-btn active" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="ja">JA</button>
        <button class="lang-btn" data-lang="vi">VI</button>
        <button class="lang-btn" data-lang="zh">ZH</button>
        <button class="lang-btn" data-lang="ar">AR</button>
      </div>

      <!-- Menu View -->
      <div id="menu-view" class="card animate-fade-in">
        <h2 id="menu-title">Game Setup</h2>

        <div class="setup-group">
          <h3 id="label-mode">Game Mode</h3>
          <div class="radio-group">
            <button class="setup-btn mode-btn active" data-mode="TWO_PLAYER" id="mode-two-player">
              2 Players
            </button>
            <button class="setup-btn mode-btn" data-mode="VS_AI" id="mode-vs-ai">vs AI</button>
          </div>
        </div>

        <div class="setup-group hidden pve-setting" id="side-section">
          <h3 id="label-side">Play As</h3>
          <div class="radio-group">
            <button class="setup-btn side-btn active" data-side="RED" id="side-red">Red</button>
            <button class="setup-btn side-btn" data-side="BLACK" id="side-black">Black</button>
          </div>
        </div>
        <button id="start-btn" class="primary">Start Game</button>
      </div>

      <!-- Game View -->
      <div id="game-view" class="card hidden animate-fade-in">
        <button id="new-game-btn" class="primary">New Game</button>

        <div class="game-header">
          <div class="turn-indicator-container">
            <div class="turn-indicator red"></div>
            <div class="turn-text" id="turn-text">Red's Turn</div>
          </div>
          <div class="stat">
            <div class="stat-label" id="label-time">Time</div>
            <div class="stat-value" id="game-timer">0:00</div>
          </div>
          <div class="stat">
            <div class="stat-label" id="label-moves">Moves</div>
            <div class="stat-value" id="move-number">0</div>
          </div>
        </div>

        <div id="board-container">
          <svg id="board" viewBox="0 0 450 500" xmlns="http://www.w3.org/2000/svg">
            <!-- Board will be rendered here -->
          </svg>
        </div>
      </div>

      <!-- Result View -->
      <div id="result-view" class="card hidden animate-fade-in">
        <h2 id="result-title">Game Over</h2>

        <div id="winner-display" class="winner-display">
          <!-- Winner info will be rendered here -->
        </div>

        <div class="result-stats">
          <div class="stat">
            <div class="stat-label" id="label-total-time">Time</div>
            <div class="stat-value" id="total-time">0:00</div>
          </div>
          <div class="stat">
            <div class="stat-label" id="label-total-moves">Total Moves</div>
            <div class="stat-value" id="total-moves">0</div>
          </div>
        </div>

        <!-- High Scores Table -->
        <div class="high-scores-container">
          <h3 id="high-scores-title">High Scores</h3>
          <table id="high-scores-table">
            <thead>
              <tr>
                <th id="th-rank">Rank</th>
                <th id="th-moves">Moves</th>
                <th id="th-time">Time</th>
                <th id="th-date">Date</th>
              </tr>
            </thead>
            <tbody id="high-scores-body">
              <!-- High scores will be rendered here -->
            </tbody>
          </table>
        </div>

        <button id="restart-btn" class="primary">Play Again</button>
      </div>
    </div>

  </body>
</html>
