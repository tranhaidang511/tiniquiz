ary)}.result-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin:20px 0}.styled-select{width:100%;padding:12px;background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:8px;color:var(--text-primary);font-size:1rem;outline:none;cursor:pointer}.styled-select:focus{border-color:var(--accent-primary)}.animate-fade-in{animation:fadeIn .5s ease}@keyframes fadeIn{0%{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes stonePlaced{0%{transform:scale(0);opacity:0}50%{transform:scale(1.2)}to{transform:scale(1);opacity:1}}.stone.animate{animation:stonePlaced .3s cubic-bezier(.34,1.56,.64,1)}@media(max-width:768px){.game-info{flex-direction:column;padding:15px}.result-stats{grid-template-columns:1fr}}</style>
  </head>

  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript>
      <iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-56G5F5W4"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe>
    </noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div id="app">
      <div class="header-controls">
        <button id="home-btn" class="icon-btn" aria-label="Back to Home">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="48"
            height="48"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </button>
        <h1 id="game-title">Go</h1>
      </div>

      <!-- Language Switcher -->
      <div class="lang-switcher">
        <button class="lang-btn active" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="ja">JA</button>
        <button class="lang-btn" data-lang="vi">VI</button>
        <button class="lang-btn" data-lang="zh">ZH</button>
        <button class="lang-btn" data-lang="ar">AR</button>
      </div>

      <!-- Menu View -->
      <div id="menu-view" class="card animate-fade-in">
        <h2 id="menu-title">Game Setup</h2>

        <div class="setup-group">
          <h3 id="label-mode">Game Mode</h3>
          <div class="radio-group">
            <button class="setup-btn mode-btn active" data-mode="TWO_PLAYER" id="mode-two-player">
              2 Players
            </button>
            <button class="setup-btn mode-btn" data-mode="VS_AI" id="mode-vs-ai">vs AI</button>
          </div>
        </div>

        <div class="setup-group hidden" id="side-section">
          <h3 id="label-side">Play As</h3>
          <div class="radio-group">
            <button class="setup-btn side-btn active" data-side="BLACK" id="side-black">
              Black
            </button>
            <button class="setup-btn side-btn" data-side="WHITE" id="side-white">White</button>
          </div>
        </div>

        <div class="setup-group">
          <h3 id="label-board-size">Board Size</h3>
          <div class="radio-group">
            <button class="setup-btn size-btn" data-size="9">9 × 9</button>
            <button class="setup-btn size-btn" data-size="13">13 × 13</button>
            <button class="setup-btn size-btn active" data-size="19">19 × 19</button>
          </div>
        </div>

        <div class="setup-group">
          <h3 id="label-handicap">Handicap</h3>
          <select id="handicap-select" class="styled-select">
            <option value="0">None</option>
            <option value="2">2 Stones</option>
            <option value="3">3 Stones</option>
            <option value="4">4 Stones</option>
            <option value="5">5 Stones</option>
            <option value="6">6 Stones</option>
            <option value="7">7 Stones</option>
            <option value="8">8 Stones</option>
            <option value="9">9 Stones</option>
          </select>
        </div>

        <div class="setup-group">
          <h3 id="label-komi">Komi</h3>
          <select id="komi-select" class="styled-select">
            <option value="0.5">0.5</option>
            <option value="1.5">1.5</option>
            <option value="2.5">2.5</option>
            <option value="3.5">3.5</option>
            <option value="4.5">4.5</option>
            <option value="5.5">5.5</option>
            <option value="6.5" selected>6.5</option>
            <option value="7.5">7.5</option>
            <option value="8.5">8.5</option>
            <option value="9.5">9.5</option>
          </select>
        </div>

        <button id="start-btn" class="primary">Start Game</button>
      </div>

      <!-- Game View -->
      <div id="game-view" class="card hidden animate-fade-in">
        <div class="game-info">
          <div class="current-turn">
            <div class="turn-indicator black"></div>
            <span id="turn-text">Black's Turn</span>
          </div>
          <div class="stat">
            <div class="stat-label" id="label-time">Time</div>
            <div class="stat-value" id="game-timer">0:00</div>
          </div>
          <div class="stat">
            <div class="stat-label" id="label-moves">Moves</div>
            <div class="stat-value" id="move-number">0</div>
          </div>
          <div class="stat">
            <div class="stat-label" id="label-captures">Captures (B/W)</div>
            <div class="stat-value">
              <span id="black-captures">0</span> / <span id="white-captures">0</span>
            </div>
          </div>
        </div>

        <div id="board-container">
          <svg id="board" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
            <!-- Board rendered here -->
          </svg>
        </div>

        <div class="game-footer">
          <button id="pass-btn" class="secondary">Pass</button>
          <button id="new-game-btn" class="primary">New Game</button>
        </div>
      </div>

      <!-- Result View -->
      <div id="result-view" class="card hidden animate-fade-in">
        <h2 id="result-title">Game Over</h2>
        <div id="winner-display" class="winner-display"></div>

        <div class="result-stats">
          <div class="stat">
            <div class="stat-label" id="black-score-label">Black</div>
            <div class="stat-value" id="black-total">0</div>
          </div>
          <div class="stat">
            <div class="stat-label" id="white-score-label">White</div>
            <div class="stat-value" id="white-total">0</div>
          </div>
          <div class="stat">
            <div class="stat-label" id="label-total-time">Time</div>
            <div class="stat-value" id="total-time">0:00</div>
          </div>
          <div class="stat">
            <div class="stat-label" id="label-total-moves">Total Moves</div>
            <div class="stat-value" id="total-moves">0</div>
          </div>
        </div>

        <div class="high-scores-container">
          <h3 id="high-scores-title">High Scores</h3>
          <table id="high-scores-table">
            <thead>
              <tr>
                <th id="th-rank">Rank</th>
                <th id="th-score">Score</th>
                <th id="th-moves">Moves</th>
                <th id="th-time">Time</th>
                <th id="th-date">Date</th>
              </tr>
            </thead>
            <tbody id="high-scores-body"></tbody>
          </table>
        </div>

        <button id="restart-btn" class="primary">Play Again</button>
      </div>
    </div>

  </body>
</html>
